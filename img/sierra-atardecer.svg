<?xml version="1.0" encoding="UTF-8"?>
<!--
  ILUSTRACIÓN REFERENCIAL — no es una fotografía de la granja.
  Reemplazar por una foto real de la sierra de Pasco al atardecer.
  Proporción panorámica (16:9).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Atardecer en los Andes de Pasco</title>
  <desc id="desc">Ilustración panorámica de montañas andinas bajo un cielo dorado al atardecer.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#203b34"/>
      <stop offset=".3" stop-color="#4b5e4e"/>
      <stop offset=".6" stop-color="#b58b5b"/>
      <stop offset=".82" stop-color="#e8ba73"/>
      <stop offset="1" stop-color="#f5d59b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0bb" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ffca70" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffca70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="range1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61705f"/>
      <stop offset="1" stop-color="#34483b"/>
    </linearGradient>
    <linearGradient id="range2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5442"/>
      <stop offset="1" stop-color="#223729"/>
    </linearGradient>
    <linearGradient id="range3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4230"/>
      <stop offset="1" stop-color="#14271b"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5c34"/>
      <stop offset="1" stop-color="#17291a"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8">
      <stop offset=".55" stop-color="#06140b" stop-opacity="0"/>
      <stop offset="1" stop-color="#06140b" stop-opacity=".56"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1150" cy="464" r="330" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1150" cy="464" r="51" fill="#ffe8a9" opacity=".85"/>

  <g fill="#f1d9b0" opacity=".22" filter="url(#soft)">
    <ellipse cx="470" cy="210" rx="380" ry="46"/>
    <ellipse cx="1100" cy="275" rx="300" ry="35"/>
    <ellipse cx="820" cy="365" rx="440" ry="27"/>
  </g>

  <!-- Cordillera -->
  <path d="M0 565V431l103-76 100 89 99-119 110 107 103-74 118 91 91-116 122 92 114-73 129 97 104-84 112 85 109-110 114 102 100-53 132 88v83Z" fill="url(#range1)" opacity=".8"/>
  <path d="M0 650V530l93-55 103 67 105-82 96 70 120-86 107 82 111-60 110 74 124-84 104 73 112-49 113 67 115-88 112 78 105-49 111 65v42Z" fill="url(#range2)"/>
  <path d="M0 728V625l132-52 102 59 121-67 110 68 123-43 124 64 120-72 113 68 131-51 123 58 138-76 127 72 126-54 120 63v58Z" fill="url(#range3)"/>

  <!-- Valle -->
  <path d="M0 764c191-58 392-53 602-19 241 39 454 32 698-28 113-28 212-37 300-24v207H0Z" fill="url(#plain)"/>
  <g opacity=".28" fill="#a8a45e">
    <path d="M0 812c211-37 411-15 591 12 229 34 424 37 658-4 137-24 250-27 351-11v34c-124-14-244-3-370 20-236 48-460 36-681-2-200-34-372-45-549-20Z"/>
    <path d="M0 851c215-22 403 1 612 24 231 26 451 18 684-20 130-22 239-27 304-15v22c-114-8-241 3-372 25-225 39-457 43-680 8-205-32-384-47-548-27Z"/>
  </g>

  <!-- Casa lejana con luz -->
  <g transform="translate(1240 654) scale(.62)">
    <path d="M0 60V28l54-28 56 28v32z" fill="#d3b98e"/>
    <path d="M-8 30L55-4l64 34-7 10-57-27-56 28z" fill="#5b3523"/>
    <rect x="18" y="38" width="14" height="22" fill="#253828"/>
    <rect x="47" y="37" width="17" height="14" fill="#f2c15b"/>
    <rect x="76" y="37" width="17" height="14" fill="#f2c15b"/>
  </g>
  <circle cx="1291" cy="702" r="32" fill="#ffd477" opacity=".22" filter="url(#soft)"/>

  <!-- Árboles y pasto -->
  <g fill="#18301e" opacity=".85">
    <path d="M235 780c-27 0-46-20-46-46 0-31 27-58 46-89 19 31 46 58 46 89 0 26-19 46-46 46z"/>
    <path d="M310 796c-20 0-34-15-34-34 0-24 20-44 34-67 14 23 34 43 34 67 0 19-14 34-34 34z"/>
    <path d="M1490 786c-23 0-39-17-39-39 0-27 23-51 39-78 16 27 39 51 39 78 0 22-16 39-39 39z"/>
  </g>
  <g stroke="#768446" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M0 900c61-75 105-123 169-158M1300 900c36-57 79-94 135-116M1420 900c22-53 53-89 98-112M860 900c24-58 61-95 115-119"/>
  </g>

  <!-- Aves -->
  <g fill="none" stroke="#253c2c" stroke-width="2" opacity=".55">
    <path d="M700 278c7-7 13-7 20 0 7-7 13-7 20 0"/>
    <path d="M977 218c6-6 11-6 17 0 6-6 11-6 17 0"/>
    <path d="M560 345c5-5 10-5 15 0 5-5 10-5 15 0"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
