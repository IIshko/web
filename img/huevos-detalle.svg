<?xml version="1.0" encoding="UTF-8"?>
<!--
  ILUSTRACIÓN REFERENCIAL — no es una fotografía de la granja.
  Reemplazar por una foto real de los huevos de La Loma Escondida.
  Proporción horizontal (4:3).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Huevos frescos de libre pastoreo</title>
  <desc id="desc">Ilustración de una canasta de huevos marrones y un huevo abierto con yema dorada sobre una mesa de madera.</desc>

  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9865c"/>
      <stop offset=".35" stop-color="#8a6747"/>
      <stop offset=".75" stop-color="#66472f"/>
      <stop offset="1" stop-color="#4c3425"/>
    </linearGradient>
    <radialGradient id="light" cx=".22" cy=".08" r=".95">
      <stop offset="0" stop-color="#ffe3a6" stop-opacity=".64"/>
      <stop offset=".42" stop-color="#f5c078" stop-opacity=".15"/>
      <stop offset="1" stop-color="#1b100a" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd8a4b"/>
      <stop offset=".45" stop-color="#9a6738"/>
      <stop offset="1" stop-color="#684222"/>
    </linearGradient>
    <linearGradient id="basketInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2917"/>
      <stop offset="1" stop-color="#73502e"/>
    </linearGradient>
    <radialGradient id="egg" cx=".36" cy=".28" r=".82">
      <stop offset="0" stop-color="#fff1d2"/>
      <stop offset=".38" stop-color="#e8cba2"/>
      <stop offset=".78" stop-color="#b9875f"/>
      <stop offset="1" stop-color="#8e5f40"/>
    </radialGradient>
    <radialGradient id="eggLight" cx=".35" cy=".26" r=".84">
      <stop offset="0" stop-color="#fff7e7"/>
      <stop offset=".42" stop-color="#f1d8b4"/>
      <stop offset=".82" stop-color="#c49369"/>
      <stop offset="1" stop-color="#9b6b49"/>
    </radialGradient>
    <radialGradient id="yolk" cx=".36" cy=".3" r=".72">
      <stop offset="0" stop-color="#ffe98b"/>
      <stop offset=".35" stop-color="#f9bc25"/>
      <stop offset=".82" stop-color="#e78f09"/>
      <stop offset="1" stop-color="#c56d04"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ead8"/>
      <stop offset=".55" stop-color="#d9cbb5"/>
      <stop offset="1" stop-color="#a89780"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="30"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <pattern id="wood" width="210" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 34h210" stroke="#4e3423" stroke-width="2" opacity=".25"/>
      <path d="M0 12c50 12 130-8 210 5M0 58c66-9 136 12 210 0" fill="none" stroke="#c4a173" stroke-width="1" opacity=".13"/>
      <ellipse cx="55" cy="39" rx="32" ry="7" fill="none" stroke="#4e3423" stroke-width="1.5" opacity=".2"/>
      <ellipse cx="162" cy="19" rx="22" ry="5" fill="none" stroke="#4e3423" stroke-width="1.2" opacity=".16"/>
    </pattern>
    <pattern id="weave" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 6h36M0 18h36M0 30h36M6 0v36M18 0v36M30 0v36" stroke="#4d3019" stroke-width="3" opacity=".45"/>
      <path d="M0 6h36M0 18h36M0 30h36" stroke="#d0a368" stroke-width="1.5" opacity=".45"/>
    </pattern>
    <pattern id="linen" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9h18M9 0v18" stroke="#6b5439" stroke-width="1" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#table)"/>
  <rect width="1200" height="900" fill="url(#wood)"/>

  <!-- Luz y sombra general -->
  <ellipse cx="950" cy="760" rx="520" ry="230" fill="#21130b" opacity=".32" filter="url(#blur)"/>
  <path d="M0 0h1200v900H0z" fill="url(#light)"/>

  <!-- Manta de lino -->
  <g transform="translate(590 550) rotate(-7)">
    <path d="M-380-190c182-28 345-14 520 15 121 20 238 20 331-1v445c-130 25-251 19-382-2-165-27-313-31-469 4z" fill="#e8dcc4" opacity=".82"/>
    <path d="M-380-190c182-28 345-14 520 15 121 20 238 20 331-1v445c-130 25-251 19-382-2-165-27-313-31-469 4z" fill="url(#linen)"/>
    <path d="M-344-138c151-19 301-9 455 14M-353-95c174-20 344-10 520 16M-362-49c160-15 327-6 489 17M-371-3c188-13 381-3 567 22M-372 46c157-10 317 0 482 20M-364 96c191-9 386 2 570 28M-349 146c165-6 331 4 500 27M-333 195c169-6 337 5 504 24" fill="none" stroke="#d2c0a4" stroke-width="2" opacity=".42"/>
    <path d="M-379 236c179 15 355 29 527 55 124 19 238 22 332 9" fill="none" stroke="#8d7559" stroke-width="2" opacity=".25"/>
  </g>

  <!-- Canasta -->
  <g transform="translate(470 490) rotate(4)">
    <ellipse cx="12" cy="42" rx="310" ry="255" fill="#24140b" opacity=".4" filter="url(#blur)"/>
    <ellipse cx="0" cy="0" rx="302" ry="244" fill="url(#basket)"/>
    <ellipse cx="0" cy="0" rx="302" ry="244" fill="url(#weave)"/>
    <!-- Borde superior -->
    <ellipse cx="0" cy="-15" rx="290" ry="229" fill="none" stroke="#dbc08e" stroke-width="18" opacity=".8"/>
    <ellipse cx="0" cy="-15" rx="290" ry="229" fill="none" stroke="#6f4827" stroke-width="4" opacity=".55"/>
    <ellipse cx="0" cy="-20" rx="272" ry="212" fill="url(#basketInner)"/>
    <!-- Trama interior -->
    <ellipse cx="0" cy="-20" rx="245" ry="188" fill="none" stroke="#5f3f24" stroke-width="3" opacity=".7"/>
    <ellipse cx="0" cy="-20" rx="210" ry="156" fill="none" stroke="#9c7244" stroke-width="2" opacity=".5"/>
    <path d="M-256-53c93 69 192 97 292 84 70-9 126-34 168-74" fill="none" stroke="#b48b58" stroke-width="3" opacity=".35"/>

    <!-- Huevos -->
    <g>
      <g transform="translate(-137 -80) rotate(-18)">
        <ellipse cx="0" cy="5" rx="58" ry="78" fill="#2f1c10" opacity=".35" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="56" ry="76" fill="url(#egg)"/>
        <ellipse cx="-16" cy="-25" rx="20" ry="28" fill="#fff1d8" opacity=".22" filter="url(#blurSmall)"/>
      </g>
      <g transform="translate(-24 -119) rotate(8)">
        <ellipse cx="0" cy="5" rx="56" ry="75" fill="#2f1c10" opacity=".3" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="54" ry="73" fill="url(#egg)"/>
        <ellipse cx="-15" cy="-24" rx="19" ry="27" fill="#fff1d8" opacity=".2" filter="url(#blurSmall)"/>
      </g>
      <g transform="translate(98 -79) rotate(21)">
        <ellipse cx="0" cy="5" rx="57" ry="77" fill="#2f1c10" opacity=".34" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="55" ry="75" fill="url(#eggLight)"/>
        <ellipse cx="-16" cy="-24" rx="19" ry="27" fill="#fff4df" opacity=".25" filter="url(#blurSmall)"/>
      </g>
      <g transform="translate(-74 28) rotate(5)">
        <ellipse cx="0" cy="5" rx="57" ry="77" fill="#2f1c10" opacity=".3" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="55" ry="75" fill="url(#egg)"/>
        <ellipse cx="-16" cy="-24" rx="19" ry="27" fill="#fff1d8" opacity=".2" filter="url(#blurSmall)"/>
      </g>
      <g transform="translate(41 24) rotate(-9)">
        <ellipse cx="0" cy="5" rx="55" ry="75" fill="#2f1c10" opacity=".3" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="53" ry="72" fill="url(#eggLight)"/>
        <ellipse cx="-16" cy="-23" rx="18" ry="26" fill="#fff4df" opacity=".22" filter="url(#blurSmall)"/>
      </g>
      <g transform="translate(163 39) rotate(14)">
        <ellipse cx="0" cy="5" rx="54" ry="73" fill="#2f1c10" opacity=".33" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="52" ry="71" fill="url(#egg)"/>
        <ellipse cx="-15" cy="-23" rx="18" ry="26" fill="#fff1d8" opacity=".2" filter="url(#blurSmall)"/>
      </g>
      <g transform="translate(-195 13) rotate(6)">
        <ellipse cx="0" cy="5" rx="48" ry="65" fill="#2f1c10" opacity=".3" filter="url(#blurSmall)"/>
        <ellipse cx="0" cy="0" rx="47" ry="63" fill="url(#egg)"/>
      </g>
    </g>

    <!-- Asa -->
    <path d="M-248 40c-50 94 31 176 123 170 92-6 159-100 93-184" fill="none" stroke="#654123" stroke-width="23" stroke-linecap="round" opacity=".8"/>
    <path d="M-248 40c-50 94 31 176 123 170 92-6 159-100 93-184" fill="none" stroke="#b18048" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Huevo abierto en cuenco -->
  <g transform="translate(920 420)">
    <ellipse cx="0" cy="120" rx="166" ry="55" fill="#22130a" opacity=".38" filter="url(#blur)"/>
    <ellipse cx="0" cy="18" rx="148" ry="112" fill="url(#bowl)"/>
    <ellipse cx="0" cy="18" rx="148" ry="112" fill="none" stroke="#fff8e9" stroke-width="3" opacity=".45"/>
    <ellipse cx="0" cy="14" rx="124" ry="89" fill="#f8f0e1"/>
    <ellipse cx="0" cy="18" rx="105" ry="72" fill="#fffaf0"/>
    <!-- Clara -->
    <path d="M-83 16c14-39 52-60 91-59 44 1 80 26 86 58 5 31-24 57-78 61-52 4-107-20-99-60z" fill="#f7f0df" opacity=".9"/>
    <path d="M-62 25c21-35 66-45 100-29 20 9 30 25 25 39-8 21-42 28-76 20-29-7-55-16-49-30z" fill="#fffaf0"/>
    <!-- Yema -->
    <ellipse cx="6" cy="20" rx="45" ry="39" fill="#d88c06" opacity=".25" filter="url(#blurSmall)"/>
    <ellipse cx="3" cy="14" rx="43" ry="38" fill="url(#yolk)"/>
    <ellipse cx="-10" cy="0" rx="15" ry="12" fill="#fff3a7" opacity=".4" filter="url(#blurSmall)"/>
    <ellipse cx="19" cy="29" rx="9" ry="6" fill="#b65c03" opacity=".18"/>
    <!-- Cáscara -->
    <path d="M-87-8c3-30 31-51 61-50 32 1 57 24 58 50-12-9-28-14-48-14-26 0-52 6-71 14z" fill="url(#eggLight)"/>
    <path d="M-87-8c18-8 44-14 71-14 20 0 36 5 48 14" fill="none" stroke="#fff6e4" stroke-width="3" opacity=".6"/>
    <path d="M-63-21l7 9-9 6M-27-38l5 9-8 5M12-36l6 9-9 6" stroke="#b58a62" stroke-width="1.3" opacity=".5"/>
  </g>

  <!-- Plato con huevo entero y cuchara -->
  <g transform="translate(190 675) rotate(-18)">
    <ellipse cx="0" cy="0" rx="118" ry="79" fill="#2a180d" opacity=".38" filter="url(#blurSmall)"/>
    <ellipse cx="0" cy="-10" rx="111" ry="76" fill="#e7d7bf"/>
    <ellipse cx="0" cy="-14" rx="92" ry="58" fill="#f5ecdc"/>
    <ellipse cx="-5" cy="-18" rx="42" ry="55" fill="url(#egg)"/>
    <ellipse cx="-20" cy="-38" rx="14" ry="21" fill="#fff2da" opacity=".26" filter="url(#blurSmall)"/>
  </g>

  <!-- Granos y hierbas -->
  <g fill="#d6ad64" opacity=".7">
    <circle cx="680" cy="780" r="4"/><circle cx="704" cy="801" r="3"/><circle cx="725" cy="770" r="2.6"/>
    <circle cx="354" cy="815" r="3.2"/><circle cx="376" cy="793" r="2.2"/><circle cx="955" cy="765" r="2.8"/>
  </g>
  <g stroke="#4e6d34" stroke-width="4" stroke-linecap="round">
    <path d="M1055 725c-22-55-18-101 12-137M1060 730c31-42 65-65 105-69M1067 722c-4-41 5-77 27-107"/>
  </g>
  <g fill="#6f8c45">
    <ellipse cx="1069" cy="666" rx="19" ry="8" transform="rotate(-38 1069 666)"/>
    <ellipse cx="1093" cy="673" rx="18" ry="8" transform="rotate(28 1093 673)"/>
    <ellipse cx="1082" cy="638" rx="17" ry="7" transform="rotate(-65 1082 638)"/>
    <ellipse cx="1083" cy="700" rx="17" ry="7" transform="rotate(14 1083 700)"/>
  </g>

  <!-- Viñeta y textura -->
  <rect width="1200" height="900" fill="url(#light)" opacity=".38"/>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
</svg>
